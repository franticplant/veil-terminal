[toolchain]
# Matches RUST_TOOLCHAIN in build/Containerfile.
channel = "1.99.1"
components = ["clippy", "rustfmt"]
# x86_64-unknown-linux-musl: veil-ctl, static, so it runs on any x86_64 Linux.
targets = ["aarch64-linux-android", "x86_64-linux-android", "x86_64-unknown-linux-musl"]
profile = "minimal"
