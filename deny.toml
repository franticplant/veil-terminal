# cargo-deny policy (scripts/podman-run cargo deny check).
#
# Licenses: permissive only. Anything in the GPL family (GPL, LGPL, AGPL) fails
# the build, as does any license not listed here; adding one to the list is a
# deliberate decision, made in review. MPL-2.0 is allowed: its copyleft is per
# file, so it binds only changes to the MPL files themselves.

[graph]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace are fine without a version.
allow-wildcard-paths = true

[advisories]
# RustSec advisories fail the build; ignore one only with a written reason.
ignore = [
    # Marvin: timing side channel in the rsa crate's private-key operations
    # (decryption, signing). Veil uses rsa (via russh's "rsa" feature) only to
    # verify servers' RSA host keys and signatures, which are public-key
    # operations. Client private keys never touch this crate: they live in the
    # credential Vault / Android Keystore. Revisit if that ever changes, or
    # drop the feature once RSA-only servers no longer matter.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key verification only; no private-key operations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
