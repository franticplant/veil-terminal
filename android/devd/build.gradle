plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

// The dev agent: a separate package that owns the development control plane
// (listener, pairing, mutual TLS, scopes, access log, updater) and reaches
// Veil's dev flavor through the DevHooks Binder service. It is never part of
// a production setup. Same signing key as Veil, so the signature-level
// DEV_HOOKS permission ties the two together.
def versionCodeEnv = providers.environmentVariable('VEIL_VERSION_CODE')
def versionNameEnv = providers.environmentVariable('VEIL_VERSION_NAME')

// devd checks every APK it installs against the pinned Veil certificate.
def pinnedCert = rootProject.file('../dev/signing/veil-release-cert.sha256').text.trim()

// devd's native network side (android/devd-native, crate veil-devd-native) is
// built by cargo-ndk into build/rustJniLibs/<abi>/libveil_devd.so.
def rustAbis = (findProperty('rustAbis') ?: 'arm64-v8a,x86_64').toString().split(',')
def rustOut = layout.buildDirectory.dir('rustJniLibs')
def repoRoot = rootProject.file('..')

def cargoNdk = tasks.register('cargoNdk', Exec) {
    group = 'build'
    description = 'Builds libveil_devd.so for each Android ABI with cargo-ndk.'
    workingDir = repoRoot
    def args = ['cargo', 'ndk', '--platform', '34']
    rustAbis.each { args += ['-t', it] }
    args += ['-o', rustOut.get().asFile.path, 'build', '--release', '--locked', '-p', 'veil-devd-native']
    commandLine args
    inputs.files(fileTree(repoRoot) {
        include 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml'
        include 'android/devd-native/**'
        exclude '**/target/**'
    })
    inputs.property('abis', rustAbis.toList())
    outputs.dir(rustOut)
}

android {
    namespace = 'io.github.franticplant.veil.devd'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.franticplant.veil.devd'
        minSdk = 34
        targetSdk = 37
        versionCode = versionCodeEnv.map { it.toInteger() }.getOrElse(1)
        versionName = versionNameEnv.getOrElse('0.0.0-local')
        buildConfigField 'String', 'PINNED_CERT_SHA256', "\"${pinnedCert}\""
    }

    // Only release builds exist, so unit tests run against release.
    testBuildType = 'release'

    sourceSets {
        main {
            jniLibs.srcDir(rustOut.get().asFile.path)
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig = true
        compose = true
        aidl = true
    }
}

tasks.named('preBuild') { dependsOn cargoNdk }

// Third-party notices (assets/third_party_notices.txt): see android/notices.gradle.
ext.noticesRustManifest = 'android/devd-native/Cargo.toml'
ext.noticesRustBuildTask = ':devd:cargoNdk'
apply from: rootProject.file('notices.gradle')

androidComponents {
    beforeVariants(selector().withBuildType('debug')) { it.enable = false }
}

dependencies {
    implementation project(':devapi')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.material3

    testImplementation libs.junit
    testImplementation libs.json
}
