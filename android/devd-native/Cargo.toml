[package]
name = "veil-devd-native"
description = "devd's network side in Rust: listeners, TLS 1.3 with client certificates (rustls), framing; requests and signing go to Kotlin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Loaded by Kotlin as System.loadLibrary("veil_devd").
name = "veil_devd"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
