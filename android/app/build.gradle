plugins {
    alias(libs.plugins.android.application)
}

// Version. scripts/build passes both from git: VEIL_VERSION_CODE is the commit
// time in minutes since the epoch, times 10 (the last digit is reserved), so it
// only grows and a dev and a release build of one commit get the same code;
// VEIL_VERSION_NAME is e.g. "0.0.1-g1a2b3c4". A plain Gradle run without them
// gets an obviously local version that any real build replaces.
def versionCodeEnv = providers.environmentVariable('VEIL_VERSION_CODE')
def versionNameEnv = providers.environmentVariable('VEIL_VERSION_NAME')

android {
    namespace = 'io.github.franticplant.veil'
    compileSdk = 37

    // Native libraries are extracted at install: the engine host (libveil_engine_host.so) is an
    // executable, and Android can only run it from the extracted native library directory.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        // Permanent: the package identity every build, dev or release, shares.
        applicationId = 'io.github.franticplant.veil'
        minSdk = 34
        targetSdk = 37
        versionCode = versionCodeEnv.map { it.toInteger() }.getOrElse(1)
        versionName = versionNameEnv.getOrElse('0.0.0-local')

        // Only the ABIs the engine is built for (see :engine-client's
        // cargoNdk), so the APK never claims a device it cannot run on.
        ndk {
            abiFilters.addAll((findProperty('rustAbis') ?: 'arm64-v8a,x86_64').toString().split(','))
        }
    }

    // dev and prod are the same application (same applicationId, same signing
    // key), so either installs over the other. dev adds the development
    // control plane: its code lives only in src/dev, so a prod APK does not
    // contain it at all, and scripts/check-release-apk.sh verifies that.
    flavorDimensions = ['tooling']
    productFlavors {
        dev {
            dimension = 'tooling'
            versionNameSuffix = '-dev'
            buildConfigField 'boolean', 'DEV_TOOLS', 'true'
        }
        prod {
            dimension = 'tooling'
            buildConfigField 'boolean', 'DEV_TOOLS', 'false'
        }
    }

    // Only release builds exist (devRelease, prodRelease). They are produced
    // unsigned; scripts/sign signs them in a separate, network-less container,
    // so Gradle and its plugins never see the signing key.
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }

    // No dependency metadata blob (encrypted, unverifiable).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig = true
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('debug')) { it.enable = false }
}

dependencies {
    implementation project(':engine-client')
    implementation project(':frontend')

    // The dev control API, for src/dev only.
    devImplementation project(':devapi')
}

// Third-party notices: one text file in the APK's assets (third_party_notices.txt), shown under
// Settings > Open-source licenses and attached to every release.
//  - Java and Kotlin libraries: every module on the variant's runtime classpath, mapped to its
//    license by group through noticeLicenses. A group missing from the table fails the build, so a
//    new dependency cannot ship without its license. The texts are in android/notices/.
//  - Rust (the native libraries): cargo about over android/jni, which includes the engine host,
//    for the Android targets (about.toml), offline, from the crate sources cargo already fetched.
def noticeLicenses = [
    'androidx'           : 'Apache-2.0.txt',
    'org.jetbrains'      : 'Apache-2.0.txt',
    'org.jspecify'       : 'Apache-2.0.txt',
    'com.google.guava'   : 'Apache-2.0.txt',
    'com.google.protobuf': 'protobuf-BSD-3-Clause.txt',
]

abstract class NoticesTask extends DefaultTask {
    @Input abstract ListProperty<String> getModules()
    @Input abstract MapProperty<String, String> getLicenseByGroup()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getLicenseTexts()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE) abstract ConfigurableFileCollection getRustInputs()
    @Internal abstract DirectoryProperty getRepoRoot()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @javax.inject.Inject abstract ExecOperations getExec()

    /** group:module:version of every external module reachable from [root]. */
    static List<String> modulesOf(ResolvedComponentResult root) {
        def found = new TreeSet<String>()
        def seen = new HashSet<ComponentIdentifier>()
        def queue = new ArrayDeque<ResolvedComponentResult>([root])
        while (!queue.isEmpty()) {
            def c = queue.poll()
            if (!seen.add(c.id)) continue
            if (c.id instanceof ModuleComponentIdentifier) {
                found.add("${c.id.group}:${c.id.module}:${c.id.version}".toString())
            }
            for (d in c.dependencies) {
                if (d instanceof ResolvedDependencyResult) queue.add(d.selected)
            }
        }
        return found.toList()
    }

    @TaskAction
    void generate() {
        def table = licenseByGroup.get()
        def byText = new TreeMap<String, List<String>>()
        def unknown = []
        for (m in modules.get()) {
            def group = m.split(':')[0]
            def key = table.keySet().find { group == it || group.startsWith(it + '.') }
            if (key == null) unknown.add(m) else byText.computeIfAbsent(table[key]) { [] }.add(m)
        }
        if (!unknown.isEmpty()) {
            throw new GradleException("No license known for ${unknown.join(', ')}: add the group to " +
                "noticeLicenses in app/build.gradle and its license text to android/notices/.")
        }
        def rust = new File(temporaryDir, 'rust.txt')
        exec.exec {
            it.workingDir(repoRoot.get().asFile)
            it.commandLine('cargo', 'about', 'generate', '--offline', '--locked', '-c', 'about.toml',
                '-m', 'android/jni/Cargo.toml', 'about.hbs', '-o', rust.path)
        }
        def rule = '=' * 80
        def out = outputDir.file('third_party_notices.txt').get().asFile
        out.parentFile.mkdirs()
        out.withWriter('UTF-8') { w ->
            w.write('Veil Terminal includes the third-party software listed below, under these licenses.\n\n')
            w.write('JAVA AND KOTLIN LIBRARIES\n\n')
            byText.each { file, mods ->
                w.write(rule + '\n')
                mods.each { w.write("  ${it}\n") }
                w.write('-' * 80 + '\n')
                w.write(licenseTexts.file(file).get().asFile.getText('UTF-8'))
                w.write('\n')
            }
            w.write('\nRUST CRATES (THE NATIVE ENGINE)\n')
            w.write(rust.getText('UTF-8'))
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def notices = tasks.register("${variant.name}ThirdPartyNotices", NoticesTask) {
            modules.set(variant.runtimeConfiguration.incoming.resolutionResult.rootComponent
                .map { NoticesTask.modulesOf(it) })
            licenseByGroup.set(noticeLicenses)
            licenseTexts.set(rootProject.layout.projectDirectory.dir('notices'))
            def repo = rootProject.layout.projectDirectory.dir('..')
            repoRoot.set(repo)
            rustInputs.from(repo.file('Cargo.lock'), repo.file('about.toml'), repo.file('about.hbs'))
            // cargo about runs offline: the crate sources come from the engine's build.
            dependsOn(':engine-client:cargoNdk')
        }
        variant.sources.assets.addGeneratedSourceDirectory(notices) { it.outputDir }
    }
}
