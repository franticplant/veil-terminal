plugins {
    alias(libs.plugins.android.application)
}

// Version. scripts/build passes both from git: VEIL_VERSION_CODE is the commit
// time in minutes since the epoch, times 10 (the last digit is reserved), so it
// only grows and a dev and a release build of one commit get the same code;
// VEIL_VERSION_NAME is e.g. "0.0.1-g1a2b3c4". A plain Gradle run without them
// gets an obviously local version that any real build replaces.
def versionCodeEnv = providers.environmentVariable('VEIL_VERSION_CODE')
def versionNameEnv = providers.environmentVariable('VEIL_VERSION_NAME')

android {
    namespace = 'io.github.franticplant.veil'
    compileSdk = 37

    defaultConfig {
        // Permanent: the package identity every build, dev or release, shares.
        applicationId = 'io.github.franticplant.veil'
        minSdk = 34
        targetSdk = 37
        versionCode = versionCodeEnv.map { it.toInteger() }.getOrElse(1)
        versionName = versionNameEnv.getOrElse('0.0.0-local')

        // Only the ABIs the engine is built for (see :engine-client's
        // cargoNdk), so the APK never claims a device it cannot run on.
        ndk {
            abiFilters.addAll((findProperty('rustAbis') ?: 'arm64-v8a,x86_64').toString().split(','))
        }
    }

    // dev and prod are the same application (same applicationId, same signing
    // key), so either installs over the other. dev adds the development
    // control plane: its code lives only in src/dev, so a prod APK does not
    // contain it at all, and scripts/check-release-apk.sh verifies that.
    flavorDimensions = ['tooling']
    productFlavors {
        dev {
            dimension = 'tooling'
            versionNameSuffix = '-dev'
            buildConfigField 'boolean', 'DEV_TOOLS', 'true'
        }
        prod {
            dimension = 'tooling'
            buildConfigField 'boolean', 'DEV_TOOLS', 'false'
        }
    }

    // Only release builds exist (devRelease, prodRelease). They are produced
    // unsigned; scripts/sign signs them in a separate, network-less container,
    // so Gradle and its plugins never see the signing key.
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }

    // No dependency metadata blob (encrypted, unverifiable).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig = true
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('debug')) { it.enable = false }
}

dependencies {
    implementation project(':engine-client')
    implementation project(':frontend')

    // The dev control API, for src/dev only.
    devImplementation project(':devapi')
}
