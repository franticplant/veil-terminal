pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Veil'

// The engine protocol, the backend abstraction and the native engine binding.
// Knows nothing about UI.
include ':engine-client'
// The disposable v0.x UI. Depends only on :engine-client.
include ':frontend'
// The installable package: Application, flavors (dev/prod), packaging.
include ':app'
// Development control plane, never part of a prod APK: the shared API
// definitions and the dev agent package (io.github.franticplant.veil.devd).
include ':devapi'
include ':devd'
// Shared AIDL between the VM host package and devd: the narrow control surface.
include ':vmapi'
// The AVF host package: MANAGE_VIRTUAL_MACHINE, VM lifecycle and vsock.
// Headless; the main app binds it when VM mode is available.
include ':vm'
