# cargo about: third-party notices for the Rust code shipped in the APK.
# scripts/notices runs it for the shipped crates and Android targets only;
# the accepted licenses match deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates (publish = false) are covered by the repository LICENSE.
private = { ignore = true }
