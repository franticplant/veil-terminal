# Keeps the pinned action SHAs, the Gradle and Cargo dependencies and the
# build container's base image moving. Every update arrives as a pull request
# and goes through CI (cargo deny included) like any other change.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/build-image"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: ".github:"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "android:"
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps:"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build:"
