# Builds every target from a v* tag, signs the APKs, attests all files (SLSA
# build provenance and an SPDX SBOM, via Sigstore) and publishes them as a
# GitHub release. Anyone can check a download with:
#   gh attestation verify <file> -R franticplant/veil-terminal
#   sha256sum -c SHA256SUMS
#
# Targets: Veil (prod), Veil dev (with the development control plane), devd
# (the dev agent) and veil-ctl (its laptop CLI, static x86_64 Linux). Each
# comes with its third-party notices. The release notes say which is for whom:
# dev Veil and devd are development tools, not for everyday use.
#
# Triggered by pushing a tag like v0.1.0, or manually for an existing tag.
# The tag decides: vX.Y.Z is a full release (shown as latest); a tag with a
# suffix (v0.1.1-pre.1, v0.2.0-rc1) is a pre-release.
# The versionName is the tag without its "v"; scripts/build refuses a dirty
# tree or a HEAD other than the tag's commit.
#
# Secrets live in the "release" environment, which only admits main and v*
# tags; v* tags are immutable (repository ruleset). scripts/sign checks the
# signing certificate against dev/signing/veil-release-cert.sha256, and the
# publish job checks it again, independently, before anything is published.
#
# Release notes come from docs/release-notes/<tag>.md at the tag; without it,
# GitHub's generated notes are used. Build details are appended either way.
#
# Reproducibility (a second runner rebuilding and comparing byte for byte, as
# in Tailmesh) is not here yet; see docs/design/0004-release-pipeline.md.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build, sign and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for attestations
      attestations: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # scripts/build checks HEAD against the tag.
          fetch-depth: 0
          persist-credentials: false

      # From the pristine checkout, before any build output exists: Cargo.lock
      # and the Gradle build scripts.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The pinned toolchain, without build caches: nothing from earlier runs
      # goes into what we ship.
      - uses: ./.github/actions/setup-build
        with:
          cache: "false"
          musl: "true"

      - name: Rust tests
        run: scripts/run cargo test --workspace --locked
      - name: Dependency licenses and advisories
        run: scripts/run cargo deny --locked check

      - name: Build APKs (unsigned; signed below)
        env:
          VEIL_RELEASE_TAG: ${{ env.TAG }}
        run: scripts/build all
      - name: Release check (prod carries no dev pieces)
        run: scripts/run --offline scripts/check-release-apk.sh android/app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
      - name: Release check, inverted (dev must still be recognised)
        run: scripts/run --offline scripts/check-release-apk.sh --expect-dev android/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk
      - name: Build veil-ctl
        run: |
          scripts/ctl
          mv dist/veil-ctl "dist/veil-ctl-$TAG-linux-x86_64"
          mv dist/veil-ctl-third-party-notices.txt "dist/veil-ctl-$TAG-third-party-notices.txt"

      # scripts/sign checks the pinned certificate digest and runs the release
      # check again on the signed APK.
      - name: Sign
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VEIL_KEYSTORE_BASE64" ]; then
            echo "::error::VEIL_KEYSTORE_BASE64 is not set in the release environment"
            exit 1
          fi
          export VEIL_KEYSTORE="$RUNNER_TEMP/veil-release.p12"
          umask 077
          printf '%s' "$VEIL_KEYSTORE_BASE64" | base64 -d > "$VEIL_KEYSTORE"
          scripts/sign prod
          scripts/sign dev
          scripts/sign devd
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/veil-release.p12"

      # The notices inside each APK, also as a file of their own.
      - name: Third-party notices
        run: |
          for apk in dist/*.apk; do
            out="${apk%.apk}-third-party-notices.txt"
            unzip -p "$apk" assets/third_party_notices.txt > "$out"
            test -s "$out"
          done

      - name: Checksums
        run: |
          cp "$RUNNER_TEMP/sbom.spdx.json" "dist/veil-$TAG.spdx.json"
          (cd dist && rm -f SHA256SUMS && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/veil-${{ env.TAG }}.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
      actions: read # CI's result for the tagged commit
    steps:
      # The release runs its own Rust tests and release checks, but not CI's
      # Kotlin tests and lint: publish only a commit CI passed. When the tag
      # and main are pushed together, CI is still running; wait for it.
      - name: Require CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          for _ in $(seq 1 60); do
            result=$(gh run list -w CI -c "$SHA" -e push -L 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')
            echo "CI on $SHA: ${result:-no run yet}"
            case "$result" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI did not pass on $SHA; not publishing"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $SHA did not finish in 30 minutes; not publishing"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            docs/release-notes
            dev/signing
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist

      # The artifact round trip must not have changed anything that was
      # attested, and every file must carry this workflow's attestation.
      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          for f in dist/*; do
            [[ $(basename "$f") == SHA256SUMS ]] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
            echo "verified: $f"
          done

      # Independent of scripts/sign: the runner's own apksigner, the digest
      # from the tag's dev/signing.
      - name: Verify the signing certificate
        run: |
          expected=$(tr -d '[:space:]' < dev/signing/veil-release-cert.sha256)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$apk: $got"
            if [[ "${got,,}" != "${expected,,}" ]]; then
              echo "::error::$apk is signed by $got, expected $expected"
              exit 1
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; else prerelease="--latest"; fi
          notes="$RUNNER_TEMP/notes.md"
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            cp "docs/release-notes/$TAG.md" "$notes"
            generate=""
          else
            : > "$notes"
            generate="--generate-notes"
          fi
          cert=$(tr -d '[:space:]' < dev/signing/veil-release-cert.sha256)
          v=${TAG#v}
          {
            echo
            echo "### Files"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`veil-$v.apk\` | **Veil.** Install this one. |"
            echo "| \`veil-$v-dev.apk\` | Veil with the development control plane (DevHooks), for development with devd. Same app and key: installs over Veil, and back. |"
            echo "| \`veil-devd-$v.apk\` | devd, the development agent: remote control of Veil over tether or tailnet, with pairing. For development only. |"
            echo "| \`veil-ctl-$TAG-linux-x86_64\` | veil-ctl, the laptop CLI for devd. Static; any x86_64 Linux. |"
            echo "| \`*-third-party-notices.txt\` | Third-party licenses of each of the above (also inside each APK). |"
            echo "| \`*.idsig\` | APK signature scheme v4 files, for incremental install. |"
            echo "| \`veil-$TAG.spdx.json\` | SBOM (SPDX). |"
            echo "| \`SHA256SUMS\` | Checksums of every file. |"
            echo
            echo "---"
            echo "Built by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$BUILD_SHA\`."
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
            echo
            echo "Verify a download: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\` and \`sha256sum -c SHA256SUMS\`."
          } >> "$notes"
          # Created with all assets at once, so it works with immutable releases.
          gh release create "$TAG" dist/* --verify-tag --title "Veil $TAG" \
            --notes-file "$notes" $generate $prerelease
