# Every push and pull request: Rust checks, Android build and tests, the
# release check on both flavors. Pushes to main also produce signed dev APKs.
#
# No build container in CI: .github/actions/setup-build installs the pinned
# toolchain from build/toolchain.lock on the runner (the same list the local
# container is built from), and scripts/run uses it directly. The toolchain,
# the NDK, the cargo registry and target directory and Gradle's caches are
# cached, keyed on the files that decide their contents.
#
# Builds here are unsigned; signing happens only in the "release" environment
# (dev-apk below, and release.yml), and only signed APKs are ever published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run: only
# the newest commit's result matters, and runners are not spent on the rest.
# (Releases are a separate workflow and never cancelled.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # versionCode comes from the commit time, versionName from the sha.
          fetch-depth: 1
      - uses: ./.github/actions/setup-build

      - name: Rust format
        run: scripts/run cargo fmt --all --check
      - name: Rust lints
        run: scripts/run cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: scripts/run cargo test --workspace --locked
      - name: Dependency licenses and advisories
        run: scripts/run cargo deny --locked check

      - name: Build APKs (unsigned; signed in dev-apk)
        run: scripts/build all
      - name: Kotlin format, unit tests, lint
        run: scripts/run ./android/gradlew -p android --console=plain ktfmtCheck testDebugUnitTest :devd:testReleaseUnitTest lintProdRelease lintDevRelease :devd:lintRelease
      - name: Release check (prod must carry no dev pieces)
        run: scripts/run --offline scripts/check-release-apk.sh android/app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
      - name: Release check, inverted (dev must still be recognised)
        run: scripts/run --offline scripts/check-release-apk.sh --expect-dev android/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: |
            android/*/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: android/app/build/outputs/apk/*/release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-devd
          path: android/devd/build/outputs/apk/release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-vm
          path: android/vm/build/outputs/apk/release/*.apk
          retention-days: 7

  # Signed dev APKs for pushes to main. Only this job can use the "release"
  # environment, which holds the signing key and only accepts main and v* tags.
  dev-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          signing-only: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks
          path: android/app/build/outputs/apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-devd
          path: android/devd/build/outputs/apk/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-vm
          path: android/vm/build/outputs/apk/release
      - name: Sign
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VEIL_KEYSTORE_BASE64" ]; then
            echo "::warning::VEIL_KEYSTORE_BASE64 is not set in the release environment; no signed dev APK"
            exit 0
          fi
          export VEIL_KEYSTORE="$RUNNER_TEMP/veil-release.p12"
          umask 077
          printf '%s' "$VEIL_KEYSTORE_BASE64" | base64 -d > "$VEIL_KEYSTORE"
          scripts/sign dev
          scripts/sign devd
          scripts/sign vm
          rm -f "$VEIL_KEYSTORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-dev-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: ignore
