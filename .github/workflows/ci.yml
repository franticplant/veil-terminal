# Every push and pull request: Rust checks, Android build and tests, the
# release check on both flavors. Pushes to main also produce signed dev APKs.
#
# Everything runs in the same container as local builds (build/Containerfile,
# through scripts/podman-run), so CI and a laptop build the same thing. The
# image and the cargo/Gradle caches are kept with actions/cache, keyed on the
# files that decide their contents.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VEIL_CACHE_DIR: ${{ github.workspace }}/../veil-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # versionCode comes from the commit time, versionName from the sha.
          fetch-depth: 1
      - uses: ./.github/actions/build-image
      - name: Restore build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VEIL_CACHE_DIR }}
          key: build-cache-${{ hashFiles('Cargo.lock', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'build/Containerfile') }}
          restore-keys: build-cache-

      - name: Rust format
        run: scripts/podman-run cargo fmt --all --check
      - name: Rust lints
        run: scripts/podman-run cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: scripts/podman-run cargo test --workspace --locked
      - name: Dependency licenses and advisories
        run: scripts/podman-run cargo deny --locked check

      - name: Build APKs (unsigned)
        run: scripts/build all
      - name: Kotlin format, unit tests, lint
        run: scripts/podman-run ./android/gradlew -p android --console=plain ktfmtCheck testDebugUnitTest :devd:testReleaseUnitTest lintProdRelease lintDevRelease :devd:lintRelease
      - name: Release check (prod must carry no dev pieces)
        run: scripts/podman-run --offline scripts/check-release-apk.sh android/app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
      - name: Release check, inverted (dev must still be recognised)
        run: scripts/podman-run --offline scripts/check-release-apk.sh --expect-dev android/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk

      - name: Save build caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VEIL_CACHE_DIR }}
          key: build-cache-${{ hashFiles('Cargo.lock', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'build/Containerfile') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: android/app/build/outputs/apk/*/release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-devd
          path: android/devd/build/outputs/apk/release/*.apk
          retention-days: 7

  # Signed dev APKs for pushes to main. Only this job can use the "release"
  # environment, which holds the signing key and only accepts main and v* tags.
  dev-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks
          path: android/app/build/outputs/apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-devd
          path: android/devd/build/outputs/apk/release
      - name: Sign
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VEIL_KEYSTORE_BASE64" ]; then
            echo "::warning::VEIL_KEYSTORE_BASE64 is not set in the release environment; no signed dev APK"
            exit 0
          fi
          export VEIL_KEYSTORE="$RUNNER_TEMP/veil-release.p12"
          umask 077
          printf '%s' "$VEIL_KEYSTORE_BASE64" | base64 -d > "$VEIL_KEYSTORE"
          scripts/sign dev
          scripts/sign devd
          rm -f "$VEIL_KEYSTORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-dev-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: ignore
